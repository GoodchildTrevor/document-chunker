services:
  document-chunker:
    build: .
    container_name: document_chunker
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8001}:8001"
    environment:
      FILE_WORKER_URL: ${FILE_WORKER_URL}
      LIBREOFFICE_TIMEOUT: ${LIBREOFFICE_TIMEOUT:-60}
      CHUNK_SIZE: ${CHUNK_SIZE:-512}
      OVERLAP: ${OVERLAP:-1}
    volumes:
      - /tmp/chunker_tmp:/tmp   # shared tmp for LibreOffice conversions
    healthcheck:
      # `python` is guaranteed to exist in `python:*-slim`, so we don't need
      # to install curl just for the healthcheck. urllib.request raises on
      # any non-2xx, which gives us the same semantics as `curl -f`.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              urllib.request.urlopen("http://localhost:8001/health", timeout=3)
          except Exception as e:
              print("healthcheck failed:", e, file=sys.stderr)
              sys.exit(1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s